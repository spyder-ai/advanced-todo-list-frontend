<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="wrapper">
        <form id="registerForm">
            <h2>Register</h2>
            <div class="input-field">
                <input name="username" required type="text" required>
                <label>Enter your Name</label>
            </div>
            <div class="input-field">
                <input name="email" type="text" required>
                <label>Enter your Email</label>
            </div>
            <div class="input-field">
                <input name="password" type="password" required>
                <label>Enter your password</label>
            </div>
            <button type="submit">Register</button>
            <div class="register">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(form));
            try {
                const res = await fetch('https://advanced-todo-list-4.onrender.com/api/register', {
                    method: 'POST',
                    credentials: 'include', // important to receive cookie
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const body = await res.json();
                if (!res.ok) return alert(body.msg || 'Register failed');
                // redirect to index (logged in automatically)
                window.location.href = 'index.html';
            } catch (err) {
                console.error(err);
                alert('Network error');
            }
        });
    </script>
</body>

</html>
